<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>dh6k blog manager</title>
    <style>
      /* AMOLED black cho admin: Sveltia không có option theme đen tuyền,
         nhưng toàn bộ theme của nó chạy bằng CSS variable. Đè độ sáng của
         các lớp nền dark xuống 0% (đen tuyệt đối), các lớp trên giữ một
         chút sáng để còn phân biệt được panel / hover / selected. Chữ,
         viền và màu accent giữ nguyên. Chỉ có tác dụng khi đang ở dark
         mode (theo hệ thống hoặc setting trong app); light mode không
         đụng gì. Selector :root[data-theme="dark"] có specificity cao
         hơn rule [data-theme="dark"] của Sveltia nên luôn thắng, không
         cần !important. Nếu bản Sveltia sau đổi tên biến thì đoạn này
         lặng lẽ mất tác dụng, admin về lại dark xám mặc định. */
      html[data-theme="dark"] {
        background: #000;
      }
      :root[data-theme="dark"] {
        --sui-background-color-1-hsl: var(--sui-base-hue) 10% 0%;
        --sui-background-color-2-hsl: var(--sui-base-hue) 10% 0%;
        --sui-background-color-3-hsl: var(--sui-base-hue) 10% 4%;
        --sui-background-color-4-hsl: var(--sui-base-hue) 10% 8%;
        --sui-background-color-5-hsl: var(--sui-base-hue) 10% 14%;
      }
    </style>
    <script>
      // Đặt data-theme sớm để trang chờ load không chớp nền trắng trên
      // máy đang dark mode. Sveltia sẽ tự chỉnh lại theo setting đã lưu
      // trong trình duyệt khi nó boot xong.
      try {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
</html>
