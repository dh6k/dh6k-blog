# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Sveltia CMS — admin web cho blog.dh6k.vip (Astro 7, static, Vercel).
# Chỉ 2 file tĩnh: public/admin/index.html + file này. Không server, không
# database, không đổi output của Astro. Bài vẫn là file .md trong Git.
#
# Đăng nhập: "Sign in with Token" — fine-grained PAT của GitHub, chỉ repo
# dh6k/dh6k-blog, quyền Contents: Read and write (Metadata: Read tự kèm).
# Token chỉ nằm trong localStorage trình duyệt của m, không có trong repo.
# Muốn chuyển sang nút "Sign in with GitHub" (OAuth) sau này thì deploy
# Sveltia CMS Authenticator rồi thêm base_url vào backend bên dưới.
#
# QUAN TRỌNG: field bên dưới phải khớp 1-1 với schema trong
# src/content.config.ts. Đổi một bên thì đổi cả hai, không thì build gãy.

backend:
  name: github
  repo: dh6k/dh6k-blog
  branch: main
  # Repo public nên chỉ cần scope hẹp này, không cần scope repo đầy đủ.
  auth_scope: public_repo

# Bài mới commit thẳng lên main, Vercel tự deploy lại. Không dùng
# editorial_workflow (tạo PR từng bài) vì chỉ có một người viết.
publish_mode: simple

site_url: https://blog.dh6k.vip
display_url: https://blog.dh6k.vip

# Bỏ field optional đang trống thì đừng ghi nó ra frontmatter: ghi
# updatedDate: "" hay heroImage: "" sẽ làm Astro build gãy (z.coerce.date
# / image() không ăn chuỗi rỗng). 6/11 bài hiện tại không có heroImage.
output:
  omit_empty_optional_fields: true

collections:
  - name: blog
    label: Bài viết
    label_singular: Bài viết
    folder: src/content/blog
    create: true
    # Tên file = tiêu đề slug hóa, khớp quy ước 11 bài hiện tại.
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    sortable_fields: [pubDate, title]
    # Không bật preview: chưa có preview template, bật lên chỉ thấy trắng.
    editor:
      preview: false
    # Ảnh up lên src/assets/blog để Astro optimize lúc build (không phải
    # public/). Đường dẫn ghi vào bài là dạng tương đối từ file .md trong
    # src/content/blog, đúng y hệt 11 bài hiện tại:
    # heroImage: "../../assets/blog/ten-bai-cover.jpg"
    # ![](../../assets/blog/ten-bai-01.png)
    media_folder: ../../assets/blog
    public_folder: ../../assets/blog
    fields:
      - { label: Tiêu đề, name: title, widget: string, required: true }
      - { label: Mô tả, name: description, widget: text, required: true }
      - label: Ngày đăng
        name: pubDate
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: true
      - label: Ngày cập nhật
        name: updatedDate
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: false
      - { label: Ảnh bìa, name: heroImage, widget: image, required: false }
      - label: Tags
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string }
      - { label: Nội dung, name: body, widget: markdown, required: true }
