# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Sveltia CMS — admin web cho blog.dh6k.vip (Astro 7, static, Vercel).
# Chỉ 2 file tĩnh: public/admin/index.html + file này. Không server, không
# database, không đổi output của Astro. Bài vẫn là file .md trong Git.
#
# Đăng nhập: nút "Sign in with GitHub" (OAuth qua Worker
# sveltia-cms-auth), dự phòng bằng "Sign in with Token" — fine-grained
# PAT của GitHub, chỉ repo dh6k/dh6k-blog, quyền Contents: Read and
# write (Metadata: Read tự kèm). Token chỉ nằm trong localStorage
# trình duyệt của m, không có trong repo.
#
# QUAN TRỌNG: field bên dưới phải khớp 1-1 với schema trong
# src/content.config.ts. Đổi một bên thì đổi cả hai, không thì build gãy.

backend:
  name: github
  repo: dh6k/dh6k-blog
  branch: main
  # Repo public nên chỉ cần scope hẹp này, không cần scope repo đầy đủ.
  auth_scope: public_repo
  # Sign-in bằng GitHub (OAuth) qua Worker sveltia-cms-auth.
  # Worker đã có GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET và
  # ALLOWED_DOMAINS=blog.dh6k.vip. Đăng nhập bằng token vẫn dùng
  # được (nút mũi tên cạnh Sign In).
  base_url: https://sveltia-cms-auth.1b1a6.workers.dev

# Bài mới commit thẳng lên main, Vercel tự deploy lại. Không dùng
# editorial_workflow (tạo PR từng bài) vì chỉ có một người viết.
publish_mode: simple

site_url: https://blog.dh6k.vip
display_url: https://blog.dh6k.vip

# Nhận diện riêng của dh6k: logo này hiện trên header admin, thành
# favicon của tab trình duyệt, và logo nhỏ trên trang đăng nhập.
# (logo_url cũ đã deprecated, dùng logo.src.)
logo:
  src: /admin-logo.svg
  show_in_header: true

# Tên hiển thị của admin thay cho "Sveltia CMS": tiêu đề trang đăng
# nhập, câu chào mừng, tiêu đề tab trình duyệt, và tên trong manifest.
app_title: dh6k blog manager

# Sveltia bắt buộc phải có media_folder ở cấp global — chỉ khai ở cấp
# collection thì nó vẫn báo "The media folder is not defined". Giá trị
# global là đường dẫn từ gốc repo; public_folder ở cấp global phải là
# đường dẫn tuyệt đối bắt đầu bằng "/" (Sveltia validate vậy), còn
# collection blog bên dưới override lại bằng đường dẫn tương đối từ
# thư mục bài viết — cả hai đều trỏ tới cùng một chỗ: src/assets/blog.
# Đường dẫn ghi vào frontmatter vẫn lấy từ collection, không đổi.
media_folder: src/assets/blog
public_folder: /src/assets/blog

# Bỏ field optional đang trống thì đừng ghi nó ra frontmatter: ghi
# updatedDate: "" hay heroImage: "" sẽ làm Astro build gãy (z.coerce.date
# / image() không ăn chuỗi rỗng). 6/11 bài hiện tại không có heroImage.
output:
  omit_empty_optional_fields: true

collections:
  - name: blog
    label: Bài viết
    label_singular: Bài viết
    folder: src/content/blog
    create: true
    # Tên file = tiêu đề slug hóa, khớp quy ước 11 bài hiện tại.
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    sortable_fields: [pubDate, title]
    # Không bật preview: chưa có preview template, bật lên chỉ thấy trắng.
    editor:
      preview: false
    # Ảnh up lên src/assets/blog để Astro optimize lúc build (không phải
    # public/). Đường dẫn ghi vào bài là dạng tương đối từ file .md trong
    # src/content/blog, đúng y hệt 11 bài hiện tại:
    # heroImage: "../../assets/blog/ten-bai-cover.jpg"
    # ![](../../assets/blog/ten-bai-01.png)
    media_folder: ../../assets/blog
    public_folder: ../../assets/blog
    fields:
      - { label: Tiêu đề, name: title, widget: string, required: true }
      - { label: Mô tả, name: description, widget: text, required: true }
      - label: Ngày đăng
        name: pubDate
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: true
      - label: Ngày cập nhật
        name: updatedDate
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: false
      - { label: Ảnh bìa, name: heroImage, widget: image, required: false }
      - label: Tags
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string }
      - { label: Nội dung, name: body, widget: markdown, required: true }
